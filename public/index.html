  <head>
    <meta charset="utf-8" />

      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#000000" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- App title -->
    <title>Golf Scorecard</title>

    <!-- OG tags for iMessage/SMS link previews -->
    <meta property="og:title" content="⛳ Golf Round Results" />
    <meta
      property="og:description"
      content="Tap to view the full leaderboard"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://5jmz8f.csb.app" />
    <!-- No og:image = no big preview card in iMessage, just a small link -->
    <meta name="twitter:card" content="summary" />
  </head>

    <noscript> You need to enable JavaScript to run this app. </noscript>
